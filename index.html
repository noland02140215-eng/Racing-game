<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>3D Racing Game</title>
    <style>
        * { 
            box-sizing: border-box; 
            touch-action: none; 
            -webkit-user-select: none; 
            user-select: none; 
        }
        body { 
            margin: 0; 
            padding: 0; 
            overflow: hidden; 
            background: #87ceeb; 
            font-family: monospace; 
        }
        
        #ui {
            position: absolute;
            top: 15px;
            left: 15px;
            color: #fff;
            background: rgba(0, 0, 0, 0.7);
            padding: 10px 14px;
            border-radius: 6px;
            pointer-events: none;
            z-index: 10;
            font-size: 13px;
        }
        
        #cam-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            z-index: 20;
            background: rgba(255, 255, 255, 0.25);
            border: 2px solid #fff;
            color: #fff;
            font-weight: bold;
            padding: 10px 16px;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
        }

        .touch-container {
            position: absolute;
            bottom: 25px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: space-between;
            padding: 0 20px;
            z-index: 20;
            pointer-events: none;
        }

        .touch-group {
            display: flex;
            gap: 12px;
            pointer-events: auto;
        }

        .btn {
            width: 65px;
            height: 65px;
            border-radius: 50%;
            border: 2px solid rgba(255,255,255,0.6);
            background: rgba(255,255,255,0.2);
            color: #fff;
            font-size: 18px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(4px);
        }

        .btn:active { background: rgba(255,255,255,0.5); }
        .btn-green { background: rgba(34, 197, 94, 0.4); border-color: #22c55e; font-size: 14px; }
        .btn-green:active { background: rgba(34, 197, 94, 0.8); }
        .btn-red { background: rgba(239, 68, 68, 0.4); border-color: #ef4444; font-size: 13px; }
        .btn-red:active { background: rgba(239, 68, 68, 0.8); }

        #error-log {
            position: absolute;
            bottom: 10px;
            left: 10px;
            right: 10px;
            color: #ff5555;
            background: rgba(0,0,0,0.85);
            padding: 10px;
            font-size: 12px;
            display: none;
            z-index: 100;
            border: 1px solid #ff5555;
        }
    </style>
    <!-- Three.js + Loaders -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/DRACOLoader.js"></script>
</head>
<body>
    <div id="ui">
        <strong>3D Racing Game</strong><br>
        <span id="cam-name">Current Camera: Third-Person Chase</span>
    </div>

    <button id="cam-btn">CAM</button>

    <div class="touch-container">
        <div class="touch-group">
            <button id="btn-left" class="btn">◀</button>
            <button id="btn-right" class="btn">▶</button>
        </div>
        <div class="touch-group">
            <button id="btn-brake" class="btn btn-red">BRAKE</button>
            <button id="btn-gas" class="btn btn-green">GAS</button>
        </div>
    </div>

    <div id="error-log"></div>

    <script>
        window.onerror = function(msg, url, line) {
            const log = document.getElementById('error-log');
            log.style.display = 'block';
            log.innerHTML = '<strong>Error:</strong> ' + msg + ' (Line ' + line + ')';
        };

        window.addEventListener('DOMContentLoaded', () => {
            const keys = { w: false, s: false, a: false, d: false };

            function bindControl(elementId, keyName) {
                const btn = document.getElementById(elementId);
                if (!btn) return;

                const press = (e) => { e.preventDefault(); keys[keyName] = true; };
                const release = (e) => { e.preventDefault(); keys[keyName] = false; };

                btn.addEventListener('pointerdown', press);
                btn.addEventListener('pointerup', release);
                btn.addEventListener('pointerleave', release);
                btn.addEventListener('pointercancel', release);
            }

            bindControl('btn-gas', 'w');
            bindControl('btn-brake', 's');
            bindControl('btn-left', 'a');
            bindControl('btn-right', 'd');

            // --- 1. SCENE SETUP ---
            const scene = new THREE.Scene();
            scene.background = new THREE.Color(0x87ceeb);
            scene.fog = new THREE.Fog(0x87ceeb, 50, 300);

            const camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.01, 1000);
            const renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            document.body.appendChild(renderer.domElement);

            const ambientLight = new THREE.AmbientLight(0xffffff, 1.2);
            scene.add(ambientLight);

            const sun = new THREE.DirectionalLight(0xffffff, 1.5);
            sun.position.set(50, 80, 50);
            sun.castShadow = true;
            scene.add(sun);

            // Ground & Infinite Grid
            const groundGeo = new THREE.PlaneGeometry(1000, 1000);
            const groundMat = new THREE.MeshStandardMaterial({ color: 0x333333 });
            const ground = new THREE.Mesh(groundGeo, groundMat);
            ground.rotation.x = -Math.PI / 2;
            ground.receiveShadow = true;
            scene.add(ground);

            const grid = new THREE.GridHelper(1000, 200, 0xffffff, 0x555555);
            grid.position.y = 0.01;
            scene.add(grid);

            // --- 2. MODEL LOADING ---
            const carGroup = new THREE.Group();
            scene.add(carGroup);

            // Red Box Fallback Mesh
            const fallbackGeo = new THREE.BoxGeometry(2, 0.8, 4);
            const fallbackMat = new THREE.MeshStandardMaterial({ color: 0xdc2626 });
            let carModel = new THREE.Mesh(fallbackGeo, fallbackMat);
            carModel.position.y = 0.6;
            carGroup.add(carModel);

            // Draco & GLTF Configuration
            const dracoLoader = new THREE.DRACOLoader();
            dracoLoader.setDecoderPath('https://www.gstatic.com/draco/v1/decoders/');

            const loader = new THREE.GLTFLoader();
            loader.setDRACOLoader(dracoLoader);

            // Relative path to uploaded repository asset
            const modelUrl = './ferrari.glb';

            loader.load(
                modelUrl,
                (gltf) => {
                    carGroup.remove(carModel); // Remove red box
                    carModel = gltf.scene;
                    carModel.rotation.y = Math.PI;
                    
                    carModel.traverse((child) => {
                        if (child.isMesh) {
                            child.castShadow = true;
                            child.receiveShadow = true;
                        }
                    });

                    carGroup.add(carModel);
                },
                undefined,
                (error) => {
                    console.warn("Could not find ./ferrari.glb in repo root.", error);
                }
            );

            // --- 3. CAMERAS & CONTROLS ---
            const cameraViews = [
                { name: "Third-Person Chase", offset: new THREE.Vector3(0, 2.5, -7), lookAt: new THREE.Vector3(0, 0.8, 5) },
                { name: "Interior Cockpit", offset: new THREE.Vector3(-0.35, 1.1, 0.2), lookAt: new THREE.Vector3(-0.35, 1.0, 10) },
                { name: "Hood Cam", offset: new THREE.Vector3(0, 1.1, 1.8), lookAt: new THREE.Vector3(0, 1.0, 15) }
            ];
            let currentCamIndex = 0;

            function cycleCamera() {
                currentCamIndex = (currentCamIndex + 1) % cameraViews.length;
                document.getElementById('cam-name').innerText = "Current Camera: " + cameraViews[currentCamIndex].name;
            }

            document.getElementById('cam-btn').addEventListener('click', cycleCamera);

            window.addEventListener('keydown', (e) => {
                const k = e.key.toLowerCase();
                if (k in keys) keys[k] = true;
                if (k === 'c') cycleCamera();
            });

            window.addEventListener('keyup', (e) => {
                const k = e.key.toLowerCase();
                if (k in keys) keys[k] = false;
            });

            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });

            // --- 4. GAME LOOP ---
            let speed = 0, angle = 0;
            const maxSpeed = 0.6, accel = 0.015, friction = 0.96;

            function animate() {
                requestAnimationFrame(animate);

                if (keys.w) speed = Math.min(speed + accel, maxSpeed);
                if (keys.s) speed = Math.max(speed - accel, -maxSpeed / 2);
                speed *= friction;

                if (Math.abs(speed) > 0.001) {
                    const dir = speed > 0 ? 1 : -1;
                    if (keys.a) angle += 0.03 * dir;
                    if (keys.d) angle -= 0.03 * dir;
                }

                carGroup.rotation.y = angle;
                carGroup.position.x += Math.sin(angle) * speed;
                carGroup.position.z += Math.cos(angle) * speed;

                ground.position.x = carGroup.position.x;
                ground.position.z = carGroup.position.z;
                grid.position.x = carGroup.position.x;
                grid.position.z = carGroup.position.z;

                const activeView = cameraViews[currentCamIndex];
                const relativeCamOffset = activeView.offset.clone().applyAxisAngle(new THREE.Vector3(0, 1, 0), angle);
                const relativeLookAt = activeView.lookAt.clone().applyAxisAngle(new THREE.Vector3(0, 1, 0), angle);

                camera.position.copy(carGroup.position).add(relativeCamOffset);
                camera.lookAt(carGroup.position.clone().add(relativeLookAt));

                renderer.render(scene, camera);
            }

            animate();
        });
    </script>
</body>
</html>
