<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>3D Racing Game - Drift & Soft Body</title>
    <style>
        * { 
            box-sizing: border-box; 
            touch-action: none; 
            -webkit-user-select: none; 
            user-select: none; 
        }
        body { 
            margin: 0; 
            padding: 0; 
            overflow: hidden; 
            background: #87ceeb; 
            font-family: monospace; 
        }
        
        #ui {
            position: absolute;
            top: 15px;
            left: 15px;
            color: #fff;
            background: rgba(0, 0, 0, 0.7);
            padding: 10px 14px;
            border-radius: 6px;
            pointer-events: none;
            z-index: 10;
            font-size: 13px;
            line-height: 1.5;
        }
        
        #cam-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            z-index: 20;
            background: rgba(255, 255, 255, 0.25);
            border: 2px solid #fff;
            color: #fff;
            font-weight: bold;
            padding: 10px 16px;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
        }

        .touch-container {
            position: absolute;
            bottom: 25px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: space-between;
            padding: 0 20px;
            z-index: 20;
            pointer-events: none;
        }

        .touch-group {
            display: flex;
            gap: 12px;
            pointer-events: auto;
        }

        .btn {
            width: 65px;
            height: 65px;
            border-radius: 50%;
            border: 2px solid rgba(255,255,255,0.6);
            background: rgba(255,255,255,0.2);
            color: #fff;
            font-size: 18px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(4px);
            cursor: pointer;
        }

        .btn:active { background: rgba(255,255,255,0.5); }
        .btn-green { background: rgba(34, 197, 94, 0.4); border-color: #22c55e; font-size: 14px; }
        .btn-green:active { background: rgba(34, 197, 94, 0.8); }
        .btn-red { background: rgba(239, 68, 68, 0.4); border-color: #ef4444; font-size: 13px; }
        .btn-red:active { background: rgba(239, 68, 68, 0.8); }

        #error-log {
            position: absolute;
            bottom: 10px;
            left: 10px;
            right: 10px;
            color: #ff5555;
            background: rgba(0,0,0,0.85);
            padding: 10px;
            font-size: 12px;
            display: none;
            z-index: 100;
            border: 1px solid #ff5555;
        }
    </style>

    <!-- Modern Three.js ES Module Import Map -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>
    <div id="ui">
        <strong>3D Racing Game</strong><br>
        <span id="cam-name">Camera: Third-Person Chase</span><br>
        <span id="speed-display">Speed: 0 MPH</span>
    </div>

    <button id="cam-btn">CAM</button>

    <div class="touch-container">
        <div class="touch-group">
            <button id="btn-left" class="btn">◀</button>
            <button id="btn-right" class="btn">▶</button>
        </div>
        <div class="touch-group">
            <button id="btn-brake" class="btn btn-red">BRAKE</button>
            <button id="btn-gas" class="btn btn-green">GAS</button>
        </div>
    </div>

    <div id="error-log"></div>

    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';

        window.onerror = function(msg, url, line) {
            const log = document.getElementById('error-log');
            log.style.display = 'block';
            log.innerHTML = `<strong>Error:</strong> ${msg} (Line ${line})`;
        };

        // --- 1. CONTROLS SETUP ---
        const keys = { w: false, s: false, a: false, d: false };

        function bindControl(elementId, keyName) {
            const btn = document.getElementById(elementId);
            if (!btn) return;

            const press = (e) => { e.preventDefault(); keys[keyName] = true; };
            const release = (e) => { e.preventDefault(); keys[keyName] = false; };

            btn.addEventListener('pointerdown', press);
            btn.addEventListener('pointerup', release);
            btn.addEventListener('pointerleave', release);
            btn.addEventListener('pointercancel', release);
        }

        bindControl('btn-gas', 'w');
        bindControl('btn-brake', 's');
        bindControl('btn-left', 'a');
        bindControl('btn-right', 'd');

        // --- 2. SCENE & LIGHTING SETUP ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87ceeb);
        scene.fog = new THREE.Fog(0x87ceeb, 60, 320);

        const camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.1, 1000);
        
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.body.appendChild(renderer.domElement);

        const ambientLight = new THREE.AmbientLight(0xffffff, 1.4);
        scene.add(ambientLight);

        const sun = new THREE.DirectionalLight(0xffffff, 2.2);
        sun.castShadow = true;
        sun.shadow.mapSize.width = 1024;
        sun.shadow.mapSize.height = 1024;
        sun.shadow.camera.near = 10;
        sun.shadow.camera.far = 200;
        const shadowRange = 25;
        sun.shadow.camera.left = -shadowRange;
        sun.shadow.camera.right = shadowRange;
        sun.shadow.camera.top = shadowRange;
        sun.shadow.camera.bottom = -shadowRange;
        scene.add(sun);
        scene.add(sun.target);

        // Ground & Snapped Infinite Grid
        const GRID_SIZE = 1000;
        const GRID_DIVISIONS = 200;
        const CELL_SIZE = GRID_SIZE / GRID_DIVISIONS;

        const groundGeo = new THREE.PlaneGeometry(GRID_SIZE, GRID_SIZE);
        const groundMat = new THREE.MeshStandardMaterial({ color: 0x2b2b2b, roughness: 0.9 });
        const ground = new THREE.Mesh(groundGeo, groundMat);
        ground.rotation.x = -Math.PI / 2;
        ground.receiveShadow = true;
        scene.add(ground);

        const grid = new THREE.GridHelper(GRID_SIZE, GRID_DIVISIONS, 0xffffff, 0x555555);
        grid.position.y = 0.01;
        scene.add(grid);

        // --- 3. CAR & MODEL LOADING ---
        const carGroup = new THREE.Group();
        scene.add(carGroup);

        // Red Box Fallback Mesh
        const fallbackGeo = new THREE.BoxGeometry(2, 0.8, 4);
        const fallbackMat = new THREE.MeshStandardMaterial({ color: 0xdc2626 });
        let carModel = new THREE.Mesh(fallbackGeo, fallbackMat);
        carModel.position.y = 0.6;
        carModel.castShadow = true;
        carModel.receiveShadow = true;
        carGroup.add(carModel);

        const dracoLoader = new DRACOLoader();
        dracoLoader.setDecoderPath('https://www.gstatic.com/draco/v1/decoders/');

        const loader = new GLTFLoader();
        loader.setDRACOLoader(dracoLoader);

        loader.load(
            './ferrari.glb',
            (gltf) => {
                carGroup.remove(carModel);
                carModel = gltf.scene;
                carModel.rotation.y = Math.PI;
                
                carModel.traverse((child) => {
                    if (child.isMesh) {
                        child.castShadow = true;
                        child.receiveShadow = true;
                    }
                });

                carGroup.add(carModel);
            },
            undefined,
            (error) => {
                console.warn("Could not find ./ferrari.glb in repo root; using fallback mesh.", error);
            }
        );

        // --- 4. CAMERAS & INPUT LISTENERS ---
        const cameraViews = [
            { name: "Third-Person Chase", offset: new THREE.Vector3(0, 2.8, -7.5), lookAt: new THREE.Vector3(0, 0.9, 4) },
            { name: "Interior Cockpit", offset: new THREE.Vector3(-0.35, 1.1, 0.2), lookAt: new THREE.Vector3(-0.35, 1.0, 10) },
            { name: "Hood Cam", offset: new THREE.Vector3(0, 1.1, 1.8), lookAt: new THREE.Vector3(0, 1.0, 15) }
        ];
        let currentCamIndex = 0;

        const camNameEl = document.getElementById('cam-name');
        const speedDisplayEl = document.getElementById('speed-display');

        function cycleCamera() {
            currentCamIndex = (currentCamIndex + 1) % cameraViews.length;
            camNameEl.innerText = `Camera: ${cameraViews[currentCamIndex].name}`;
        }

        document.getElementById('cam-btn').addEventListener('click', cycleCamera);

        window.addEventListener('keydown', (e) => {
            const k = e.key.toLowerCase();
            if (k in keys) keys[k] = true;
            if (k === 'c') cycleCamera();
        });

        window.addEventListener('keyup', (e) => {
            const k = e.key.toLowerCase();
            if (k in keys) keys[k] = false;
        });

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // --- 5. DRIFT, SOFT BODY & GAME LOOP ---
        const clock = new THREE.Clock();
        const yAxis = new THREE.Vector3(0, 1, 0);

        // Physics parameters
        let speed = 0;
        let angle = 0;
        let lateralVelocity = 0; // Enables drift / sliding
        const maxSpeed = 45;
        const accel = 26;
        const brakeForce = 38;
        const drag = 1.6;
        const turnSpeed = 2.4;
        const grip = 4.5;        // Lower = more drift slide, Higher = tighter grip

        function animate() {
            requestAnimationFrame(animate);

            const dt = Math.min(clock.getDelta(), 0.1);
            const time = clock.getElapsedTime();

            // Throttle & Brake
            if (keys.w) speed = Math.min(speed + accel * dt, maxSpeed);
            if (keys.s) {
                const force = speed > 0 ? brakeForce : accel;
                speed = Math.max(speed - force * dt, -maxSpeed * 0.4);
            }

            speed *= Math.exp(-drag * dt);
            if (Math.abs(speed) < 0.05 && !keys.w && !keys.s) speed = 0;

            // Steering & Drift Physics
            let steeringInput = 0;
            if (Math.abs(speed) > 0.2) {
                const dir = speed > 0 ? 1 : -1;
                const turnFactor = Math.min(Math.abs(speed) / 10, 1);
                if (keys.a) { steeringInput = 1; angle += turnSpeed * turnFactor * dir * dt; }
                if (keys.d) { steeringInput = -1; angle -= turnSpeed * turnFactor * dir * dt; }
            }

            // Calculate forward and sideways movement vectors for drift
            const forwardX = Math.sin(angle);
            const forwardZ = Math.cos(angle);
            
            // Lateral slip (drift mechanics)
            const targetLateral = steeringInput * (Math.abs(speed) * 0.35);
            lateralVelocity += (targetLateral - lateralVelocity) * Math.min(grip * dt, 1);

            carGroup.rotation.y = angle;
            carGroup.position.x += (forwardX * speed - Math.cos(angle) * lateralVelocity) * dt;
            carGroup.position.z += (forwardZ * speed + Math.sin(angle) * lateralVelocity) * dt;

            // Soft Body Dynamics (Suspension pitch, roll & bounce)
            const accelerationVal = keys.w ? 1 : (keys.s ? -1 : 0);
            const bodyPitch = accelerationVal * 0.08 - (speed / maxSpeed) * 0.05;
            const bodyRoll = -steeringInput * (Math.abs(speed) / maxSpeed) * 0.18 + (lateralVelocity * 0.03);
            const suspensionBounce = Math.sin(time * 14) * (Math.abs(speed) / maxSpeed) * 0.03;

            carModel.rotation.x = THREE.MathUtils.lerp(carModel.rotation.x, bodyPitch, 10 * dt);
            carModel.rotation.z = THREE.MathUtils.lerp(carModel.rotation.z, bodyRoll, 10 * dt);
            carModel.position.y = 0.6 + suspensionBounce;

            // Ground & Snapped Grid
            ground.position.x = carGroup.position.x;
            ground.position.z = carGroup.position.z;
            grid.position.x = Math.floor(carGroup.position.x / CELL_SIZE) * CELL_SIZE;
            grid.position.z = Math.floor(carGroup.position.z / CELL_SIZE) * CELL_SIZE;

            // Directional Shadow Follow
            sun.position.set(carGroup.position.x + 30, 50, carGroup.position.z + 30);
            sun.target.position.copy(carGroup.position);

            // Smooth Lagged Camera
            const activeView = cameraViews[currentCamIndex];
            const relativeCamOffset = activeView.offset.clone().applyAxisAngle(yAxis, angle);
            const relativeLookAt = activeView.lookAt.clone().applyAxisAngle(yAxis, angle);

            const targetCamPos = carGroup.position.clone().add(relativeCamOffset);
            const targetLookAt = carGroup.position.clone().add(relativeLookAt);

            // Smoothly interpolate (lerp) camera position and look-at for organic motion lag
            const camLerpSpeed = currentCamIndex === 0 ? 8 : 15; // Chase cam has more organic lag
            camera.position.lerp(targetCamPos, camLerpSpeed * dt);
            
            // Smooth look-at target
            if (!window._currentLookAt) window._currentLookAt = targetLookAt.clone();
            window._currentLookAt.lerp(targetLookAt, 15 * dt);
            camera.lookAt(window._currentLookAt);

            // Speedometer HUD
            const mph = Math.round(Math.abs(speed) * 2.237);
            speedDisplayEl.innerText = `Speed: ${mph} MPH`;

            renderer.render(scene, camera);
        }

        animate();
    </script>
</body>
</html>
