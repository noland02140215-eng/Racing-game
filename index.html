<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>3D Racing Game - Sakura Highway</title>
    <style>
        * { 
            box-sizing: border-box; 
            touch-action: none; 
            -webkit-user-select: none; 
            user-select: none; 
        }
        html, body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: #ffd9e8;
            font-family: monospace;
            overscroll-behavior: none;
            overscroll-behavior-x: none;
        }
        
        #ui {
            position: absolute;
            top: 15px;
            left: 15px;
            color: #fff;
            background: rgba(0, 0, 0, 0.7);
            padding: 10px 14px;
            border-radius: 6px;
            pointer-events: none;
            z-index: 10;
            font-size: 13px;
            line-height: 1.5;
        }
        
        .top-controls {
            position: absolute;
            top: 15px;
            right: 15px;
            z-index: 20;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .top-btn {
            background: rgba(255, 255, 255, 0.25);
            border: 2px solid #fff;
            color: #fff;
            font-weight: bold;
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 13px;
            cursor: pointer;
            backdrop-filter: blur(4px);
        }
        .top-btn:active { background: rgba(255, 255, 255, 0.5); }

        .touch-container {
            position: absolute;
            bottom: 25px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: space-between;
            padding: 0 20px;
            z-index: 20;
            pointer-events: none;
        }

        .touch-group {
            display: flex;
            gap: 10px;
            align-items: center;
            pointer-events: auto;
        }

        .btn {
            width: 62px;
            height: 62px;
            border-radius: 50%;
            border: 2px solid rgba(255,255,255,0.6);
            background: rgba(255,255,255,0.2);
            color: #fff;
            font-size: 16px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(4px);
            cursor: pointer;
        }

        .btn:active { background: rgba(255,255,255,0.5); }
        .btn-green { background: rgba(34, 197, 94, 0.4); border-color: #22c55e; font-size: 13px; }
        .btn-green:active { background: rgba(34, 197, 94, 0.8); }
        .btn-red { background: rgba(239, 68, 68, 0.4); border-color: #ef4444; font-size: 12px; }
        .btn-red:active { background: rgba(239, 68, 68, 0.8); }
        .btn-amber { background: rgba(245, 158, 11, 0.4); border-color: #f59e0b; font-size: 11px; }
        .btn-amber:active { background: rgba(245, 158, 11, 0.85); }

        #error-log {
            position: absolute;
            bottom: 10px;
            left: 10px;
            right: 10px;
            color: #ff5555;
            background: rgba(0,0,0,0.85);
            padding: 10px;
            font-size: 12px;
            display: none;
            z-index: 100;
            border: 1px solid #ff5555;
        }

        #engine-badge {
            position: absolute;
            bottom: 10px;
            right: 15px;
            color: #fff;
            background: rgba(0,0,0,0.6);
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 10px;
            z-index: 10;
            pointer-events: none;
        }
    </style>

    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>
    <div id="ui">
        <strong>3D Racing Game — Sakura Highway</strong><br>
        <span id="cam-name">Camera: Third-Person Chase</span><br>
        <span id="speed-display">Speed: 0 MPH</span><br>
        <span id="damage-display">Integrity: 100%</span>
    </div>

    <div class="top-controls">
        <button id="cam-btn" class="top-btn">CAM</button>
        <button id="repair-btn" class="top-btn">REPAIR [R]</button>
    </div>

    <div class="touch-container">
        <div class="touch-group">
            <button id="btn-left" class="btn">◀</button>
            <button id="btn-right" class="btn">▶</button>
        </div>
        <div class="touch-group">
            <button id="btn-handbrake" class="btn btn-amber">DRIFT</button>
            <button id="btn-brake" class="btn btn-red">BRAKE</button>
            <button id="btn-gas" class="btn btn-green">GAS</button>
        </div>
    </div>

    <div id="error-log"></div>
    <div id="engine-badge">Physics: loading…</div>

    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';
        import init, { PhysicsWorld } from './racing-physics/pkg/racing_physics.js';

        window.onerror = function(msg, url, line) {
            const log = document.getElementById('error-log');
            log.style.display = 'block';
            log.innerHTML = `<strong>Error:</strong> ${msg} (Line ${line})`;
        };

        document.addEventListener('touchmove', (e) => { e.preventDefault(); }, { passive: false });
        document.addEventListener('gesturestart', (e) => { e.preventDefault(); });
        document.addEventListener('dblclick', (e) => { e.preventDefault(); });

        // --- 0. WASM PHYSICS ENGINE (Rust) — falls back to JS if unavailable ---
        const engineBadgeEl = document.getElementById('engine-badge');
        let physicsWorld = null;
        let wasmReady = false;
        try {
            await init();
            physicsWorld = new PhysicsWorld();
            wasmReady = true;
            engineBadgeEl.innerText = 'Physics: Rust/WASM';
            console.log('Rust/WASM physics engine loaded.');
        } catch (err) {
            wasmReady = false;
            engineBadgeEl.innerText = 'Physics: JS fallback';
            console.warn('Rust/WASM physics unavailable — falling back to JS physics.', err);
        }

        // --- 1. CONTROLS SETUP ---
        const keys = { w: false, s: false, a: false, d: false, space: false };

        function bindControl(elementId, keyName) {
            const btn = document.getElementById(elementId);
            if (!btn) return;

            const press = (e) => { e.preventDefault(); keys[keyName] = true; };
            const release = (e) => { e.preventDefault(); keys[keyName] = false; };

            btn.addEventListener('pointerdown', press);
            btn.addEventListener('pointerup', release);
            btn.addEventListener('pointerleave', release);
            btn.addEventListener('pointercancel', release);
        }

        bindControl('btn-gas', 'w');
        bindControl('btn-brake', 's');
        bindControl('btn-left', 'a');
        bindControl('btn-right', 'd');
        bindControl('btn-handbrake', 'space');

        // --- 2. SCENE & LIGHTING SETUP (Sakura Highway theme) ---
        const scene = new THREE.Scene();
        const SKY_COLOR = 0xffd9e8;
        scene.background = new THREE.Color(SKY_COLOR);
        scene.fog = new THREE.Fog(SKY_COLOR, 90, 480);

        const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.05, 1200);
        
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.body.appendChild(renderer.domElement);

        const ambientLight = new THREE.AmbientLight(0xfff0e0, 1.3);
        scene.add(ambientLight);

        const sun = new THREE.DirectionalLight(0xffe9c7, 2.2);
        sun.castShadow = true;
        sun.shadow.mapSize.width = 1024;
        sun.shadow.mapSize.height = 1024;
        sun.shadow.camera.near = 10;
        sun.shadow.camera.far = 250;
        const shadowRange = 40;
        sun.shadow.camera.left = -shadowRange;
        sun.shadow.camera.right = shadowRange;
        sun.shadow.camera.top = shadowRange;
        sun.shadow.camera.bottom = -shadowRange;
        scene.add(sun);
        scene.add(sun.target);

        // Ground & Snapped Infinite Grid (asphalt road through a grassy field)
        const GRID_SIZE = 1200;
        const GRID_DIVISIONS = 240;
        const CELL_SIZE = GRID_SIZE / GRID_DIVISIONS;

        const groundGeo = new THREE.PlaneGeometry(GRID_SIZE, GRID_SIZE);
        const groundMat = new THREE.MeshStandardMaterial({ color: 0x4a5a3c, roughness: 0.95 });
        const ground = new THREE.Mesh(groundGeo, groundMat);
        ground.rotation.x = -Math.PI / 2;
        ground.receiveShadow = true;
        scene.add(ground);

        const roadGeo = new THREE.PlaneGeometry(16, GRID_SIZE);
        const roadMat = new THREE.MeshStandardMaterial({ color: 0x2b2b2e, roughness: 0.85 });
        const road = new THREE.Mesh(roadGeo, roadMat);
        road.rotation.x = -Math.PI / 2;
        road.position.y = 0.005;
        road.receiveShadow = true;
        scene.add(road);

        const grid = new THREE.GridHelper(GRID_SIZE, GRID_DIVISIONS, 0xffffff, 0x8a8a8a);
        grid.position.y = 0.01;
        scene.add(grid);

        // --- 2b. JAPAN-INSPIRED SET DRESSING ---
        function buildFuji() {
            const group = new THREE.Group();
            const baseMat = new THREE.MeshStandardMaterial({ color: 0x5c6b7a, roughness: 1 });
            const snowMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.9 });

            const base = new THREE.Mesh(new THREE.ConeGeometry(230, 260, 48), baseMat);
            base.position.y = 130;
            group.add(base);

            const cap = new THREE.Mesh(new THREE.ConeGeometry(95, 95, 48), snowMat);
            cap.position.y = 230;
            group.add(cap);

            group.position.set(60, 0, 560);
            group.traverse(c => { if (c.isMesh) c.receiveShadow = false; });
            return group;
        }
        scene.add(buildFuji());

        function buildCherryBlossoms() {
            const TREE_COUNT = 160;
            const trunkGeo = new THREE.CylinderGeometry(0.18, 0.26, 2.2, 6);
            const trunkMat = new THREE.MeshStandardMaterial({ color: 0x5b3a29, roughness: 0.9 });
            const blossomGeo = new THREE.IcosahedronGeometry(1.15, 1);
            const blossomMat = new THREE.MeshStandardMaterial({ color: 0xffb6d5, roughness: 0.8, flatShading: true });

            const trunks = new THREE.InstancedMesh(trunkGeo, trunkMat, TREE_COUNT);
            const blossoms = new THREE.InstancedMesh(blossomGeo, blossomMat, TREE_COUNT);
            trunks.castShadow = true;
            blossoms.castShadow = true;

            const dummy = new THREE.Object3D();
            for (let i = 0; i < TREE_COUNT; i++) {
                const side = i % 2 === 0 ? 1 : -1;
                const x = side * (11 + Math.random() * 45);
                const z = -80 + Math.random() * 700;
                const scale = 0.8 + Math.random() * 0.6;

                dummy.position.set(x, 1.1 * scale, z);
                dummy.scale.set(scale, scale, scale);
                dummy.rotation.y = Math.random() * Math.PI;
                dummy.updateMatrix();
                trunks.setMatrixAt(i, dummy.matrix);

                dummy.position.set(x, 2.3 * scale, z);
                dummy.updateMatrix();
                blossoms.setMatrixAt(i, dummy.matrix);
            }
            trunks.instanceMatrix.needsUpdate = true;
            blossoms.instanceMatrix.needsUpdate = true;

            const group = new THREE.Group();
            group.add(trunks, blossoms);
            return group;
        }
        scene.add(buildCherryBlossoms());

        function buildToriiGate(z) {
            const group = new THREE.Group();
            const mat = new THREE.MeshStandardMaterial({ color: 0xcc3b2c, roughness: 0.6 });
            const capMat = new THREE.MeshStandardMaterial({ color: 0x1c1c1c, roughness: 0.6 });

            const legGeo = new THREE.CylinderGeometry(0.45, 0.55, 7.5, 12);
            const legL = new THREE.Mesh(legGeo, mat);
            legL.position.set(-6.5, 3.75, 0);
            const legR = new THREE.Mesh(legGeo, mat);
            legR.position.set(6.5, 3.75, 0);

            const topBeam = new THREE.Mesh(new THREE.BoxGeometry(15.5, 0.6, 1.2), mat);
            topBeam.position.set(0, 7.6, 0);
            const topCap = new THREE.Mesh(new THREE.BoxGeometry(16.5, 0.45, 1.6), capMat);
            topCap.position.set(0, 8.05, 0);
            const underBeam = new THREE.Mesh(new THREE.BoxGeometry(13.5, 0.4, 0.8), mat);
            underBeam.position.set(0, 6.5, 0);

            group.add(legL, legR, topBeam, topCap, underBeam);
            group.position.set(0, 0, z);
            group.traverse(c => { if (c.isMesh) { c.castShadow = true; c.receiveShadow = true; } });
            return group;
        }
        [40, 160, 290, 420, 560].forEach(z => scene.add(buildToriiGate(z)));

        function buildLantern(x, z) {
            const group = new THREE.Group();
            const stoneMat = new THREE.MeshStandardMaterial({ color: 0x8c8c86, roughness: 1 });
            const glowMat = new THREE.MeshStandardMaterial({ color: 0xffcf7a, emissive: 0xff9d2e, emissiveIntensity: 0.9, roughness: 0.5 });

            const base = new THREE.Mesh(new THREE.CylinderGeometry(0.4, 0.5, 0.3, 8), stoneMat);
            const pillar = new THREE.Mesh(new THREE.CylinderGeometry(0.18, 0.18, 1.1, 8), stoneMat);
            pillar.position.y = 0.7;
            const box = new THREE.Mesh(new THREE.BoxGeometry(0.55, 0.55, 0.55), glowMat);
            box.position.y = 1.4;
            const roof = new THREE.Mesh(new THREE.ConeGeometry(0.55, 0.4, 4), stoneMat);
            roof.rotation.y = Math.PI / 4;
            roof.position.y = 1.85;

            group.add(base, pillar, box, roof);
            group.position.set(x, 0, z);
            group.traverse(c => { if (c.isMesh) { c.castShadow = true; c.receiveShadow = true; } });
            return group;
        }
        for (let z = 0; z < 650; z += 24) {
            scene.add(buildLantern(9.5, z));
            scene.add(buildLantern(-9.5, z + 12));
        }

        // --- 3. CRASH OBSTACLES (restyled as wooden crates / stone blocks) ---
        const obstacles = [];
        const barrierGeo = new THREE.BoxGeometry(3.2, 1.4, 1.4);
        const barrierMatWood = new THREE.MeshStandardMaterial({ color: 0x8b5a2b, roughness: 0.85 });
        const barrierMatStone = new THREE.MeshStandardMaterial({ color: 0x9a9690, roughness: 0.95 });
        const OBSTACLE_RADIUS = 1.9;

        function addObstacleMesh(x, z, material, rotY) {
            const mesh = new THREE.Mesh(barrierGeo, material);
            mesh.position.set(x, 0.7, z);
            if (rotY) mesh.rotation.y = rotY;
            mesh.castShadow = true;
            mesh.receiveShadow = true;
            scene.add(mesh);

            obstacles.push({
                mesh,
                radius: OBSTACLE_RADIUS,
                velocity: new THREE.Vector3(),
                angularVel: 0
            });

            // Register this obstacle with the Rust physics world in the SAME
            // order it was pushed to the JS `obstacles` array, so indices
            // line up when we read back `result.obstacles[i]` each frame.
            if (wasmReady) {
                physicsWorld.add_obstacle(x, z, OBSTACLE_RADIUS, mesh.rotation.y);
            }
        }

        function spawnObstacles() {
            const placements = [
                { x: 0, z: 35 }, { x: 4, z: 35 }, { x: -4, z: 35 },
                { x: 14, z: 65 }, { x: -14, z: 95 }, { x: 12, z: 130 },
                { x: -18, z: 25 }, { x: 22, z: -20 }, { x: -25, z: -55 }
            ];

            placements.forEach((pos, idx) => {
                addObstacleMesh(pos.x, pos.z, idx % 2 === 0 ? barrierMatWood : barrierMatStone);
            });

            for (let i = 0; i < 40; i++) {
                const angleStep = (i / 40) * Math.PI * 2;
                const dist = 50 + (i % 5) * 35;
                addObstacleMesh(
                    Math.cos(angleStep) * dist,
                    Math.sin(angleStep) * dist,
                    i % 2 === 0 ? barrierMatWood : barrierMatStone,
                    angleStep
                );
            }
        }
        spawnObstacles();

        // --- 4. CAR & SOFT-BODY SETUP ---
        const carGroup = new THREE.Group();
        scene.add(carGroup);

        function buildProceduralCar() {
            const group = new THREE.Group();
            const bodyMat = new THREE.MeshStandardMaterial({ color: 0xdc2626, roughness: 0.35, metalness: 0.35 });
            const cabinMat = new THREE.MeshStandardMaterial({ color: 0x14161a, roughness: 0.4, metalness: 0.15 });
            const wheelMat = new THREE.MeshStandardMaterial({ color: 0x1a1a1a, roughness: 0.9 });
            const rimMat = new THREE.MeshStandardMaterial({ color: 0xb8bcc2, roughness: 0.4, metalness: 0.7 });
            const glassMat = new THREE.MeshStandardMaterial({ color: 0x9fd4ff, roughness: 0.05, metalness: 0.1, transparent: true, opacity: 0.55 });
            const headlightMat = new THREE.MeshStandardMaterial({ color: 0xfffbe0, emissive: 0xfff2a8, emissiveIntensity: 0.7 });
            const taillightMat = new THREE.MeshStandardMaterial({ color: 0xff3b3b, emissive: 0xff0000, emissiveIntensity: 0.5 });

            const body = new THREE.Mesh(new THREE.BoxGeometry(1.9, 0.55, 4.2, 6, 3, 10), bodyMat);
            body.position.y = 0.5;

            const hood = new THREE.Mesh(new THREE.BoxGeometry(1.65, 0.22, 1.3, 4, 2, 4), bodyMat);
            hood.position.set(0, 0.76, 1.35);

            const cabin = new THREE.Mesh(new THREE.BoxGeometry(1.45, 0.5, 1.8, 4, 3, 5), cabinMat);
            cabin.position.set(0, 0.95, -0.2);

            const windshield = new THREE.Mesh(new THREE.BoxGeometry(1.4, 0.45, 0.06), glassMat);
            windshield.name = 'windshield_glass';
            windshield.position.set(0, 0.93, 0.78);
            windshield.rotation.x = -0.35;

            const rearGlass = new THREE.Mesh(new THREE.BoxGeometry(1.4, 0.42, 0.06), glassMat);
            rearGlass.name = 'rear_glass';
            rearGlass.position.set(0, 0.9, -1.1);
            rearGlass.rotation.x = 0.4;

            group.add(body, hood, cabin, windshield, rearGlass);

            const wheelGeo = new THREE.CylinderGeometry(0.42, 0.42, 0.32, 16);
            const rimGeo = new THREE.CylinderGeometry(0.2, 0.2, 0.34, 8);
            const wheelPositions = [
                [-0.98, 0.42, 1.35], [0.98, 0.42, 1.35],
                [-0.98, 0.42, -1.35], [0.98, 0.42, -1.35]
            ];
            wheelPositions.forEach((p) => {
                const wheel = new THREE.Mesh(wheelGeo, wheelMat);
                wheel.rotation.z = Math.PI / 2;
                wheel.position.set(...p);
                const rim = new THREE.Mesh(rimGeo, rimMat);
                rim.rotation.z = Math.PI / 2;
                rim.position.set(...p);
                group.add(wheel, rim);
            });

            [[-0.72, 0.55, 2.08], [0.72, 0.55, 2.08]].forEach((p) => {
                const h = new THREE.Mesh(new THREE.SphereGeometry(0.13, 8, 8), headlightMat);
                h.position.set(...p);
                group.add(h);
            });
            [[-0.72, 0.55, -2.08], [0.72, 0.55, -2.08]].forEach((p) => {
                const t = new THREE.Mesh(new THREE.BoxGeometry(0.22, 0.14, 0.08), taillightMat);
                t.position.set(...p);
                group.add(t);
            });

            group.traverse((c) => { if (c.isMesh) { c.castShadow = true; c.receiveShadow = true; } });
            return group;
        }

        let carModel = buildProceduralCar();
        carGroup.add(carModel);

        let softBodyMeshes = [];
        let carIntegrity = 100;
        let carScaleRef = 1.4;

        function registerSoftBodyModel(rootObject) {
            softBodyMeshes = [];
            rootObject.updateMatrixWorld(true);

            rootObject.traverse((child) => {
                if (child.isMesh && child.geometry && child.geometry.attributes.position) {
                    if (!child.geometry.attributes.normal) {
                        child.geometry.computeVertexNormals();
                    }

                    const posAttr = child.geometry.attributes.position;
                    const originalPositions = new Float32Array(posAttr.array.length);
                    originalPositions.set(posAttr.array);

                    softBodyMeshes.push({ mesh: child, originalPositions });
                }
            });
        }
        registerSoftBodyModel(carModel);

        const cameraViews = [
            { name: "Third-Person Chase", offset: new THREE.Vector3(0, 2.6, -7.5), lookAt: new THREE.Vector3(0, 0.7, 4) },
            { name: "Driver Seat (FP)", offset: new THREE.Vector3(0.38, 0.92, -0.15), lookAt: new THREE.Vector3(0.38, 0.85, 12) },
            { name: "Hood Cam", offset: new THREE.Vector3(0, 1.05, 1.3), lookAt: new THREE.Vector3(0, 0.95, 15) }
        ];

        function calibrateDriverCamera(model) {
            const box = new THREE.Box3().setFromObject(model);
            const size = new THREE.Vector3();
            const center = new THREE.Vector3();
            box.getSize(size);
            box.getCenter(center);

            carScaleRef = THREE.MathUtils.clamp(Math.max(size.x, size.y, size.z), 0.6, 8);

            const driverX = center.x + size.x * 0.21;
            const driverY = box.min.y + size.y * 0.69;
            const driverZ = center.z + size.z * 0.04;

            cameraViews[1].offset.set(driverX, driverY, driverZ);
            cameraViews[1].lookAt.set(driverX, driverY - 0.06, driverZ + 14);

            cameraViews[2].offset.set(center.x, box.min.y + size.y * 0.62, box.max.z - size.z * 0.28);
            cameraViews[2].lookAt.set(center.x, box.min.y + size.y * 0.58, box.max.z + 14);
        }

        calibrateDriverCamera(carModel);

        const dracoLoader = new DRACOLoader();
        dracoLoader.setDecoderPath('https://www.gstatic.com/draco/v1/decoders/');

        const loader = new GLTFLoader();
        loader.setDRACOLoader(dracoLoader);

        loader.load(
            './ferrari.glb',
            (gltf) => {
                carGroup.remove(carModel);
                carModel = gltf.scene;
                carModel.rotation.y = Math.PI;
                
                carModel.traverse((child) => {
                    if (child.isMesh) {
                        child.castShadow = true;
                        child.receiveShadow = true;
                        if (child.material) {
                            child.material.side = THREE.DoubleSide;
                        }
                    }
                });

                carGroup.add(carModel);
                calibrateDriverCamera(carModel);
                registerSoftBodyModel(carModel);
            },
            undefined,
            (error) => {
                console.warn("Could not find ./ferrari.glb in repo root; using fallback mesh.", error);
            }
        );

        // --- 5. SOFT-BODY DEFORMATION & REPAIR ---
        const damageDisplayEl = document.getElementById('damage-display');
        const _v = new THREE.Vector3();
        const _n = new THREE.Vector3();
        const _localImpact = new THREE.Vector3();

        function deformCarAtWorldPoint(worldImpactPoint, impactForce) {
            const radius = Math.max(carScaleRef * 0.42, 0.8);
            const maxDent = Math.min(impactForce * 0.03, carScaleRef * 0.22);
            const seed = impactForce * 13.37 + worldImpactPoint.x;

            let anyModified = false;

            softBodyMeshes.forEach(({ mesh }) => {
                const matName = (mesh.material && mesh.material.name) ? mesh.material.name.toLowerCase() : '';
                const meshName = mesh.name.toLowerCase();
                if (matName.includes('glass') || matName.includes('window') || meshName.includes('glass')) {
                    return;
                }

                const posAttr = mesh.geometry.attributes.position;
                const normAttr = mesh.geometry.attributes.normal;

                _localImpact.copy(worldImpactPoint);
                mesh.worldToLocal(_localImpact);

                let modified = false;
                for (let i = 0; i < posAttr.count; i++) {
                    _v.fromBufferAttribute(posAttr, i);
                    const dist = _v.distanceTo(_localImpact);

                    if (dist < radius) {
                        const falloff = Math.pow(1 - dist / radius, 2);

                        _n.fromBufferAttribute(normAttr, i).normalize();
                        _v.addScaledVector(_n, -maxDent * falloff);

                        const j = Math.sin(i * 12.9898 + seed) * 0.5;
                        _v.x += j * 0.025 * falloff;
                        _v.y += Math.cos(i * 78.233 + seed) * 0.5 * 0.025 * falloff;
                        _v.z += Math.sin(i * 37.719 + seed) * 0.5 * 0.025 * falloff;

                        posAttr.setXYZ(i, _v.x, _v.y, _v.z);
                        modified = true;
                    }
                }

                if (modified) {
                    posAttr.needsUpdate = true;
                    mesh.geometry.computeVertexNormals();
                    mesh.geometry.computeBoundingSphere();
                    anyModified = true;
                }
            });

            if (anyModified) {
                carIntegrity = Math.max(0, Math.round(carIntegrity - impactForce * 0.65));
                damageDisplayEl.innerText = `Integrity: ${carIntegrity}%`;
            }
        }

        function repairCar() {
            softBodyMeshes.forEach(({ mesh, originalPositions }) => {
                const posAttr = mesh.geometry.attributes.position;
                posAttr.array.set(originalPositions);
                posAttr.needsUpdate = true;
                mesh.geometry.computeVertexNormals();
                mesh.geometry.computeBoundingSphere();
            });
            carIntegrity = 100;
            damageDisplayEl.innerText = `Integrity: 100%`;
        }

        document.getElementById('repair-btn').addEventListener('click', repairCar);

        // --- 6. CAMERAS & INPUT LISTENERS ---
        let currentCamIndex = 0;
        const camNameEl = document.getElementById('cam-name');
        const speedDisplayEl = document.getElementById('speed-display');

        function cycleCamera() {
            currentCamIndex = (currentCamIndex + 1) % cameraViews.length;
            camNameEl.innerText = `Camera: ${cameraViews[currentCamIndex].name}`;
        }

        document.getElementById('cam-btn').addEventListener('click', cycleCamera);

        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space') {
                e.preventDefault();
                keys.space = true;
                return;
            }
            const k = e.key.toLowerCase();
            if (k in keys) keys[k] = true;
            if (k === 'c') cycleCamera();
            if (k === 'r') repairCar();
        });

        window.addEventListener('keyup', (e) => {
            if (e.code === 'Space') {
                keys.space = false;
                return;
            }
            const k = e.key.toLowerCase();
            if (k in keys) keys[k] = false;
        });

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // --- 7. PHYSICS & GAME LOOP (Rust/WASM, with JS fallback) ---
        const clock = new THREE.Clock();
        const yAxis = new THREE.Vector3(0, 1, 0);

        // Shared vehicle state — written by whichever physics path runs each frame.
        let speed = 0;
        let angle = 0;
        let lateralVelocity = 0;
        let crashPitchImpulse = 0;
        let crashRollImpulse = 0;
        let screenShake = 0;

        const UNITS_PER_MPH = 0.447;
        const maxSpeedMph = 165;
        const maxSpeed = maxSpeedMph * UNITS_PER_MPH;
        const accel = 14.5;
        const brakeForce = 22.0;
        const baseDrag = 0.95;
        const baseTurnSpeed = 2.1;
        const baseGrip = 5.5;
        const BOUNDARY_RADIUS = 580;

        // Original pure-JS physics, preserved as the fallback path if the
        // WASM module failed to load. Mutates the shared state above and
        // calls deformCarAtWorldPoint directly, exactly as before.
        // Returns steeringInput (needed for the body-roll/pitch calc below).
        function stepPhysicsJS(dt, handbrakeActive) {
            if (keys.w && !handbrakeActive) {
                speed = Math.min(speed + accel * dt, maxSpeed);
            } else if (keys.w && handbrakeActive) {
                speed = Math.min(speed + accel * 0.4 * dt, maxSpeed * 0.8);
            }

            if (keys.s) {
                const force = speed > 0 ? brakeForce : accel;
                speed = Math.max(speed - force * dt, -maxSpeed * 0.35);
            }

            const activeDrag = handbrakeActive ? 2.2 : baseDrag;
            const activeTurnSpeed = handbrakeActive ? 3.2 : baseTurnSpeed;
            const activeGrip = handbrakeActive ? 1.25 : baseGrip;
            const slipMultiplier = handbrakeActive ? 0.58 : 0.28;

            speed *= Math.exp(-activeDrag * dt);
            if (Math.abs(speed) < 0.05 && !keys.w && !keys.s) speed = 0;

            let steeringInput = 0;
            if (Math.abs(speed) > 0.2) {
                const dir = speed > 0 ? 1 : -1;
                const turnFactor = Math.min(Math.abs(speed) / 14, 1);
                if (keys.a) { steeringInput = 1; angle += activeTurnSpeed * turnFactor * dir * dt; }
                if (keys.d) { steeringInput = -1; angle -= activeTurnSpeed * turnFactor * dir * dt; }
            }

            const forwardX = Math.sin(angle);
            const forwardZ = Math.cos(angle);

            const targetLateral = steeringInput * (Math.abs(speed) * slipMultiplier);
            lateralVelocity += (targetLateral - lateralVelocity) * Math.min(activeGrip * dt, 1);

            carGroup.rotation.y = angle;
            carGroup.position.x += (forwardX * speed - Math.cos(angle) * lateralVelocity) * dt;
            carGroup.position.z += (forwardZ * speed + Math.sin(angle) * lateralVelocity) * dt;

            const carRadius = 1.85;
            for (let i = 0; i < obstacles.length; i++) {
                const obs = obstacles[i];

                if (obs.velocity.lengthSq() > 0.01) {
                    obs.mesh.position.addScaledVector(obs.velocity, dt);
                    obs.mesh.rotation.y += obs.angularVel * dt;
                    obs.velocity.multiplyScalar(Math.exp(-4.5 * dt));
                    obs.angularVel *= Math.exp(-4.5 * dt);
                }

                const dx = carGroup.position.x - obs.mesh.position.x;
                const dz = carGroup.position.z - obs.mesh.position.z;
                const distSq = dx * dx + dz * dz;
                const minDist = carRadius + obs.radius;

                if (distSq < minDist * minDist && distSq > 0.0001) {
                    const dist = Math.sqrt(distSq);
                    const overlap = minDist - dist;
                    const nx = dx / dist;
                    const nz = dz / dist;

                    carGroup.position.x += nx * overlap * 0.6;
                    carGroup.position.z += nz * overlap * 0.6;
                    obs.mesh.position.x -= nx * overlap * 0.4;
                    obs.mesh.position.z -= nz * overlap * 0.4;

                    const impactSpeed = Math.abs(speed);
                    if (impactSpeed > 3.0) {
                        const contactPoint = new THREE.Vector3(
                            obs.mesh.position.x + nx * obs.radius,
                            0.55,
                            obs.mesh.position.z + nz * obs.radius
                        );

                        deformCarAtWorldPoint(contactPoint, impactSpeed);

                        obs.velocity.set(-nx * impactSpeed * 0.75, 0, -nz * impactSpeed * 0.75);
                        obs.angularVel = (Math.random() - 0.5) * impactSpeed * 0.5;

                        crashPitchImpulse = -0.2 * Math.min(impactSpeed / 30, 1.2);
                        crashRollImpulse = (Math.random() - 0.5) * 0.25;
                        screenShake = Math.min(impactSpeed * 0.01, 0.3);

                        speed *= 0.35;
                        lateralVelocity *= 0.25;
                    }
                }
            }

            const distFromCenterSq = carGroup.position.x * carGroup.position.x + carGroup.position.z * carGroup.position.z;
            if (distFromCenterSq > BOUNDARY_RADIUS * BOUNDARY_RADIUS) {
                const distFromCenter = Math.sqrt(distFromCenterSq);
                const nx = carGroup.position.x / distFromCenter;
                const nz = carGroup.position.z / distFromCenter;
                carGroup.position.x = nx * BOUNDARY_RADIUS;
                carGroup.position.z = nz * BOUNDARY_RADIUS;

                speed *= -0.3;
                lateralVelocity *= -0.3;
                crashPitchImpulse = -0.12;
                screenShake = Math.max(screenShake, 0.16);
            }

            crashPitchImpulse *= Math.exp(-9 * dt);
            crashRollImpulse *= Math.exp(-9 * dt);
            screenShake *= Math.exp(-12 * dt);

            return steeringInput;
        }

        function animate() {
            requestAnimationFrame(animate);

            const dt = Math.min(clock.getDelta(), 0.1);
            const time = clock.getElapsedTime();
            const handbrakeActive = keys.space;
            let steeringInput = 0;

            if (wasmReady) {
                const result = physicsWorld.step(dt, keys.w, keys.s, keys.a, keys.d, handbrakeActive);

                speed = result.speed;
                angle = result.angle;
                lateralVelocity = result.lateral_velocity;
                steeringInput = result.steering_input;
                crashPitchImpulse = result.crash_pitch_impulse;
                crashRollImpulse = result.crash_roll_impulse;
                screenShake = result.screen_shake;

                carGroup.position.x = result.car_x;
                carGroup.position.z = result.car_z;
                carGroup.rotation.y = angle;

                result.obstacles.forEach((obsState, i) => {
                    const obs = obstacles[i];
                    if (!obs) return;
                    obs.mesh.position.x = obsState.x;
                    obs.mesh.position.z = obsState.z;
                    obs.mesh.rotation.y = obsState.rot_y;
                });

                result.collisions.forEach((c) => {
                    deformCarAtWorldPoint(new THREE.Vector3(c.x, c.y, c.z), c.impact_speed);
                });
            } else {
                steeringInput = stepPhysicsJS(dt, handbrakeActive);
            }

            const accelerationVal = keys.w ? 1 : (keys.s || handbrakeActive ? -1 : 0);
            const bodyPitch = accelerationVal * 0.06 - (speed / maxSpeed) * 0.035 + crashPitchImpulse;
            const bodyRoll = -steeringInput * (Math.abs(speed) / maxSpeed) * 0.14 + (lateralVelocity * 0.022) + crashRollImpulse;
            const suspensionBounce = Math.sin(time * 14) * (Math.abs(speed) / maxSpeed) * 0.02;

            carModel.rotation.x = THREE.MathUtils.lerp(carModel.rotation.x, bodyPitch, 12 * dt);
            carModel.rotation.z = THREE.MathUtils.lerp(carModel.rotation.z, bodyRoll, 12 * dt);
            carModel.position.y = (softBodyMeshes[0]?.mesh === carModel ? 0.4 : 0.0) + suspensionBounce;

            ground.position.x = carGroup.position.x;
            ground.position.z = carGroup.position.z;
            road.position.z = carGroup.position.z;
            grid.position.x = Math.floor(carGroup.position.x / CELL_SIZE) * CELL_SIZE;
            grid.position.z = Math.floor(carGroup.position.z / CELL_SIZE) * CELL_SIZE;

            sun.position.set(carGroup.position.x + 30, 50, carGroup.position.z + 30);
            sun.target.position.copy(carGroup.position);

            const activeView = cameraViews[currentCamIndex];
            const relativeCamOffset = activeView.offset.clone().applyAxisAngle(yAxis, angle);
            const relativeLookAt = activeView.lookAt.clone().applyAxisAngle(yAxis, angle);

            const targetCamPos = carGroup.position.clone().add(relativeCamOffset);
            const targetLookAt = carGroup.position.clone().add(relativeLookAt);

            if (currentCamIndex === 0) {
                camera.position.lerp(targetCamPos, 8 * dt);
                if (!window._currentLookAt) window._currentLookAt = targetLookAt.clone();
                window._currentLookAt.lerp(targetLookAt, 18 * dt);
                camera.lookAt(window._currentLookAt);
            } else {
                camera.position.copy(targetCamPos);
                camera.position.y += suspensionBounce * 0.6;
                targetLookAt.y += bodyPitch * 4;
                camera.lookAt(targetLookAt);
                window._currentLookAt = targetLookAt.clone();
            }

            if (screenShake > 0.005) {
                camera.position.x += (Math.random() - 0.5) * screenShake;
                camera.position.y += (Math.random() - 0.5) * screenShake;
            }

            const mph = Math.round(Math.abs(speed) * 2.237);
            speedDisplayEl.innerText = `Speed: ${mph} MPH${handbrakeActive ? ' [DRIFT]' : ''}`;

            renderer.render(scene, camera);
        }

        animate();
    </script>
</body>
</html>
