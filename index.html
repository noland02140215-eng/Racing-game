<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>3D Racing Game</title>
    <style>
        * { box-sizing: border-box; touch-action: manipulation; }
        body { margin: 0; padding: 0; overflow: hidden; background: #000; font-family: monospace; }
        #ui {
            position: absolute;
            top: 15px;
            left: 15px;
            color: #fff;
            background: rgba(0, 0, 0, 0.7);
            padding: 10px 14px;
            border-radius: 6px;
            pointer-events: none;
            z-index: 10;
            font-size: 13px;
        }
        #error-log {
            position: absolute;
            bottom: 10px;
            left: 10px;
            right: 10px;
            color: #ff5555;
            background: rgba(0,0,0,0.85);
            padding: 10px;
            font-size: 12px;
            display: none;
            z-index: 100;
            border: 1px solid #ff5555;
        }
    </style>
    <!-- Three.js CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
    <div id="ui">
        <strong>3D Controls:</strong><br>
        W / S : Gas / Reverse<br>
        A / D : Steer<br>
        C : Switch Camera<br>
        <span id="cam-name">Current Camera: Interior Cockpit</span>
    </div>

    <div id="error-log"></div>

    <script>
        // On-screen error catcher
        window.onerror = function(msg, url, line) {
            const log = document.getElementById('error-log');
            log.style.display = 'block';
            log.innerHTML = '<strong>Error:</strong> ' + msg + ' (Line ' + line + ')';
        };

        window.addEventListener('DOMContentLoaded', () => {
            if (typeof THREE === 'undefined') {
                throw new Error("Three.js library failed to load from CDN.");
            }

            // --- 1. SCENE SETUP ---
            const scene = new THREE.Scene();
            scene.background = new THREE.Color(0x87ceeb);
            scene.fog = new THREE.Fog(0x87ceeb, 20, 150);

            const camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.1, 1000);
            const renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            document.body.appendChild(renderer.domElement);

            // Lighting
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
            scene.add(ambientLight);

            const sun = new THREE.DirectionalLight(0xffffff, 0.8);
            sun.position.set(50, 80, 50);
            sun.castShadow = true;
            scene.add(sun);

            // Ground Track Surface
            const groundGeo = new THREE.PlaneGeometry(300, 300);
            const groundMat = new THREE.MeshStandardMaterial({ color: 0x333333 });
            const ground = new THREE.Mesh(groundGeo, groundMat);
            ground.rotation.x = -Math.PI / 2;
            ground.receiveShadow = true;
            scene.add(ground);

            // Grid lines on ground for motion reference
            const grid = new THREE.GridHelper(300, 60, 0xffffff, 0x555555);
            grid.position.y = 0.01;
            scene.add(grid);

            // --- 2. CAR & INTERIOR ---
            const carGroup = new THREE.Group();
            scene.add(carGroup);

            // Car Body
            const bodyGeo = new THREE.BoxGeometry(2, 0.8, 4);
            const bodyMat = new THREE.MeshStandardMaterial({ color: 0xdc2626 });
            const body = new THREE.Mesh(bodyGeo, bodyMat);
            body.position.y = 0.6;
            body.castShadow = true;
            carGroup.add(body);

            // Interior Dashboard
            const dashGeo = new THREE.BoxGeometry(1.8, 0.4, 0.6);
            const interiorMat = new THREE.MeshStandardMaterial({ color: 0x111111 });
            const dash = new THREE.Mesh(dashGeo, interiorMat);
            dash.position.set(0, 0.8, 0.5);
            carGroup.add(dash);

            // Steering Wheel
            const wheelGeo = new THREE.TorusGeometry(0.2, 0.03, 8, 24);
            const wheelMat = new THREE.MeshStandardMaterial({ color: 0x222222 });
            const steeringWheel = new THREE.Mesh(wheelGeo, wheelMat);
            steeringWheel.position.set(-0.4, 0.9, 0.2);
            steeringWheel.rotation.x = Math.PI / 4;
            carGroup.add(steeringWheel);

            // Windshield Frame
            const frameGeo = new THREE.BoxGeometry(1.9, 0.6, 0.1);
            const frameMat = new THREE.MeshStandardMaterial({ color: 0x000000 });
            const frame = new THREE.Mesh(frameGeo, frameMat);
            frame.position.set(0, 1.2, 0.8);
            carGroup.add(frame);

            // --- 3. CAMERA POSITIONS ---
            const cameraViews = [
                { name: "Interior Cockpit", offset: new THREE.Vector3(-0.4, 1.05, -0.1), lookAt: new THREE.Vector3(-0.4, 1.0, 10) },
                { name: "Third-Person Chase", offset: new THREE.Vector3(0, 2.5, -7), lookAt: new THREE.Vector3(0, 0.8, 5) },
                { name: "Hood Cam", offset: new THREE.Vector3(0, 1.0, 1.2), lookAt: new THREE.Vector3(0, 0.8, 15) }
            ];
            let currentCamIndex = 0;

            // --- 4. INPUT & PHYSICS ---
            const keys = { w: false, s: false, a: false, d: false };
            let speed = 0, angle = 0;
            const maxSpeed = 0.6, accel = 0.015, friction = 0.96;

            window.addEventListener('keydown', (e) => {
                const k = e.key.toLowerCase();
                if (k in keys) keys[k] = true;
                if (k === 'c') {
                    currentCamIndex = (currentCamIndex + 1) % cameraViews.length;
                    document.getElementById('cam-name').innerText = "Current Camera: " + cameraViews[currentCamIndex].name;
                }
            });

            window.addEventListener('keyup', (e) => {
                const k = e.key.toLowerCase();
                if (k in keys) keys[k] = false;
            });

            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });

            // --- 5. RENDER LOOP ---
            function animate() {
                requestAnimationFrame(animate);

                if (keys.w) speed = Math.min(speed + accel, maxSpeed);
                if (keys.s) speed = Math.max(speed - accel, -maxSpeed / 2);
                speed *= friction;

                if (Math.abs(speed) > 0.001) {
                    const dir = speed > 0 ? 1 : -1;
                    if (keys.a) angle += 0.03 * dir;
                    if (keys.d) angle -= 0.03 * dir;
                }

                carGroup.rotation.y = angle;
                carGroup.position.x += Math.sin(angle) * speed;
                carGroup.position.z += Math.cos(angle) * speed;

                steeringWheel.rotation.z = keys.a ? 0.8 : (keys.d ? -0.8 : 0);

                const activeView = cameraViews[currentCamIndex];
                const relativeCamOffset = activeView.offset.clone().applyAxisAngle(new THREE.Vector3(0, 1, 0), angle);
                const relativeLookAt = activeView.lookAt.clone().applyAxisAngle(new THREE.Vector3(0, 1, 0), angle);

                camera.position.copy(carGroup.position).add(relativeCamOffset);
                camera.lookAt(carGroup.position.clone().add(relativeLookAt));

                renderer.render(scene, camera);
            }

            animate();
        });
    </script>
    <script src="mobile-controls.js"></script>
</body>
</html>
