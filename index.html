<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Racing Game</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; }
        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #fff;
            font-family: monospace;
            font-size: 14px;
            background: rgba(0, 0, 0, 0.6);
            padding: 12px;
            border-radius: 6px;
            pointer-events: none;
            z-index: 10;
        }
    </style>
    <!-- Load Three.js Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
    <div id="ui">
        <strong>Controls:</strong><br>
        W / S : Accelerate / Reverse<br>
        A / D : Steer Left / Right<br>
        C : Switch Camera View<br>
        <span id="cam-name">Current Camera: Interior Cockpit</span>
    </div>

    <!-- Game Logic -->
    <script src="main.js"></script>
    <!-- Touch Controls -->
    <script src="mobile-controls.js"></script>
</body>
</html>
