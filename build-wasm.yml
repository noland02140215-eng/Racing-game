name: Build Rust WASM Physics

on:
  push:
    branches: [ main ]
    paths:
      - 'racing-physics/**'
      - '.github/workflows/build-wasm.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Build WASM package
        working-directory: racing-physics
        run: wasm-pack build --target web --release

      - name: Commit compiled package
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f racing-physics/pkg
          git diff --staged --quiet || git commit -m "Auto-build: compile Rust physics to WebAssembly [skip ci]"
          git push
